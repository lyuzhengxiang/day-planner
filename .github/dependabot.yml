version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "supply-chain"
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"

  # Swift Package Manager — covers MacPaw/OpenAI and any future Swift deps
  # added on the change-to-xcode branch.
  - package-ecosystem: "swift"
    directory: "/macos"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "change-to-xcode"
    labels:
      - "dependencies"
      - "swift"
      - "supply-chain"
