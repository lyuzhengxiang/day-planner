name: DayPlanner
options:
  bundleIdPrefix: com.lyuzhengxiang
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signed with Developer ID Application so the system fully indexes
    # App Intents (Siri / Spotlight only properly route to a Developer-
    # ID-signed bundle, not an ad-hoc one). Override via Xcode signing
    # tab when building on another machine.
    DEVELOPMENT_TEAM: NJ4J626ZPF
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  OpenAI:
    url: https://github.com/MacPaw/OpenAI
    from: 0.4.9

targets:
  DayPlanner:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DayPlanner
    resources:
      - path: DayPlanner/Resources
    dependencies:
      - package: OpenAI
    info:
      path: DayPlanner/Info.plist
      properties:
        CFBundleName: DayPlanner
        CFBundleDisplayName: DayPlanner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Lyu Zhengxiang"
        # AppleScript-to-Messages permission prompt rationale
        NSAppleEventsUsageDescription: "DayPlanner sends your daily plan to your phone via the Messages app."
        # Background activity rationale (for proactive scheduling)
        NSSystemAdministrationUsageDescription: "DayPlanner runs scheduled jobs to generate your daily plan."
        # Make app appear in menu bar only (no Dock icon)
        # Toggle LSUIElement to YES once menu-bar-only UX is desired.
        LSUIElement: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyuzhengxiang.dayplanner
        CODE_SIGN_ENTITLEMENTS: DayPlanner/DayPlanner.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  DayPlannerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DayPlannerTests
    dependencies:
      - target: DayPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyuzhengxiang.dayplanner.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DayPlanner:
    build:
      targets:
        DayPlanner: all
        DayPlannerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DayPlannerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
